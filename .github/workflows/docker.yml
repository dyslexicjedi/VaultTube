name: Build Docker

on:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - '**.md'
  workflow_dispatch:



jobs:
    build:
        runs-on: ubuntu-latest

        services:
          mariadb:
            image: mariadb:latest
            ports:
              - 3306:3306
            env:
              MARIADB_ROOT_PASSWORD: SuperSecretPassword
              MARIADB_DATABASE: vaulttube
              MARIADB_USER: vaulttube
              MARIADB_PASSWORD: SuperSecretPassword
            options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
              cache: pip
          - name: Setup PyTest and Deps
            run: |
              sudo apt update && sudo apt install -y --no-install-recommends libmariadb-dev
              pip install -r requirements.txt
              pip install pytest
          - name: Run Tests
            env:
              VAULTTUBE_VAULTDIR: /videos
              VAULTTUBE_DBUSER: vaulttube
              VAULTTUBE_DBPASS: SuperSecretPassword
              VAULTTUBE_DBHOST: 127.0.0.1
              VAULTTUBE_DBNAME: vaulttube
              VAULTTUBE_DBPORT: 3306
              VAULTTUBE_YTKEY: abcabcabcabc
            run: |
              python -m pytest -v tests
          - name: "docker hub login"
            uses: docker/login-action@v3
            with:
                username: ${{secrets.DOCKER_HUB_USERNAME}}
                password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}}
          - name: Set up Buildx
            uses: docker/setup-buildx-action@v3
          - name: "build and push"
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: dyslexicjedi/vaulttube:dev
              cache-from: type=gha
              cache-to: type=gha,mode=max
