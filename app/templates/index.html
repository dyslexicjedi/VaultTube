{% extends "base.html" %}
{% block content %}

<!-- Animated background orbs -->
<div class="index-orb index-orb-1" aria-hidden="true"></div>
<div class="index-orb index-orb-2" aria-hidden="true"></div>

<!-- Resume Section -->
<section class="index-section" id="resumeSection" style="display:none;">
    <div class="index-section-header">
        <h5 id="resumelabel" class="index-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-2" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M11.596 8.697l-6.363 3.692A.5.5 0 0 1 4.5 12V4a.5.5 0 0 1 .733-.441l6.363 3.692a.5.5 0 0 1 0 .882z"/>
            </svg>
            Resume
        </h5>
    </div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="resumedeck"></div>
</section>

<!-- Latest Section -->
<section class="index-section">
    <div class="index-section-header">
        <h5 id="latestlabel" class="index-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-2" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
            </svg>
            Latest
        </h5>
        <div class="index-filters advanced-filters" id="advancedFilters" style="display:none; margin-top: 1rem;">
            <div class="advanced-filter-group advanced-filter-toggles">
                <div class="index-filter-pill">
                    <span class="index-filter-label">Unwatched</span>
                    <div class="form-check form-switch index-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="contentToggle" onclick="contentChange();" aria-label="Toggle content filter">
                        <label class="form-check-label" for="contentToggle"></label>
                    </div>
                    <span class="index-filter-label">All</span>
                </div>
                <div class="index-filter-pill">
                    <span class="index-filter-label">Published</span>
                    <div class="form-check form-switch index-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="dateToggle" onclick="contentChange();" aria-label="Toggle date sort">
                        <label class="form-check-label" for="dateToggle"></label>
                    </div>
                    <span class="index-filter-label">Added</span>
                </div>
            </div>
            <div class="advanced-filter-group">
                <label class="advanced-filter-label">Channel</label>
                <select id="channelFilter" class="advanced-filter-select" multiple aria-label="Filter by channel">
                </select>
            </div>
            <div class="advanced-filter-group">
                <label class="advanced-filter-label">Date Range</label>
                <div class="advanced-filter-dates">
                    <input type="date" id="fromDate" class="advanced-filter-input" aria-label="From date">
                    <input type="date" id="toDate" class="advanced-filter-input" aria-label="To date">
                </div>
                <div class="advanced-filter-presets">
                    <button type="button" class="filter-preset-btn" onclick="setDatePreset('today')">Today</button>
                    <button type="button" class="filter-preset-btn" onclick="setDatePreset('week')">This Week</button>
                    <button type="button" class="filter-preset-btn" onclick="setDatePreset('month')">This Month</button>
                    <button type="button" class="filter-preset-btn" onclick="setDatePreset('year')">This Year</button>
                    <button type="button" class="filter-preset-btn" onclick="clearDatePreset()">Clear</button>
                </div>
            </div>
            <div class="advanced-filter-group">
                <label class="advanced-filter-label">Duration</label>
                <select id="durationFilter" class="advanced-filter-select" onchange="applyFilters()">
                    <option value="">Any Duration</option>
                    <option value="<5">Under 5 min</option>
                    <option value="5-10">5-10 min</option>
                    <option value="10-30">10-30 min</option>
                    <option value="30-60">30-60 min</option>
                    <option value=">60">Over 60 min</option>
                </select>
            </div>
            <div class="advanced-filter-actions">
                <button type="button" class="btn btn-primary btn-sm" onclick="applyFilters()">Apply Filters</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear All</button>
                <button type="button" class="btn btn-link btn-sm" onclick="toggleAdvancedFilters()">Hide Filters</button>
            </div>
        </div>
        <div class="text-center mt-2">
            <button type="button" class="btn btn-link btn-sm" onclick="toggleAdvancedFilters()" id="showAdvancedBtn">Show Advanced Filters</button>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="carddeck"></div>
    <nav aria-label="Video page navigation" class="pt-4 pb-2 d-flex justify-content-center">
        <ul id="pagelist" class="pagination index-pagination" style="gap: 0.4rem;"></ul>
    </nav>
</section>

<script src="/static/js/scripts.js"></script>
<script>

    var activeFilters = {
        channel_ids: [],
        from_date: '',
        to_date: '',
        min_duration: null,
        max_duration: null
    };

    update(1);
    function update(id){
        currentId = id;
        let totalCount = 0;
        if($("#dateToggle").prop('checked')){
            sortRelease='AddedAt'
        }
        else{
            sortRelease='PublishedAt'
        }
        
        var status = $("#contentToggle").prop('checked') ? 'all' : 'unwatched';
        var apiUrl = "/api/getvids/" + status + "/" + sortRelease + "/desc/" + ((id-1)*40);
        
        var queryParams = [];
        if (activeFilters.channel_ids && activeFilters.channel_ids.length > 0) {
            $.each(activeFilters.channel_ids, function(i, cid) {
                queryParams.push("channel_ids[]=" + encodeURIComponent(cid));
            });
        }
        if (activeFilters.from_date) {
            queryParams.push("from_date=" + encodeURIComponent(activeFilters.from_date));
        }
        if (activeFilters.to_date) {
            queryParams.push("to_date=" + encodeURIComponent(activeFilters.to_date));
        }
        if (activeFilters.min_duration !== null) {
            queryParams.push("min_duration=" + activeFilters.min_duration);
        }
        if (activeFilters.max_duration !== null) {
            queryParams.push("max_duration=" + activeFilters.max_duration);
        }
        
        if (queryParams.length > 0) {
            apiUrl += "?" + queryParams.join("&");
        }
        
        var countApi = status === 'all' ? "/api/stats/video/count" : "/api/stats/video/unwatched";
        
        if($("#contentToggle").prop('checked') && activeFilters.channel_ids.length === 0 && !activeFilters.from_date && !activeFilters.to_date && !activeFilters.min_duration && !activeFilters.max_duration){
            $.get(countApi,function(data){
                totalCount = parseInt(data);
                let totalPages = Math.ceil(totalCount / 40);
                pagination(id, totalPages);
            });
        } else {
            $.get(apiUrl, function(data){
                var total = data.length;
                paginationWithTotal(id, total);
            });
        }
        
        $.getJSON(apiUrl,function(data){
            processdata(data);
        });
    }

    $.getJSON("/api/list/resume/",function(data){
        processresume(data);
    });

    function processresume(data){
        if(data.length > 0){
            $("#resumeSection").fadeIn(300);
            $("#resumedeck").empty();
            $.each(data,function(i,item){
                var jobj = jQuery.parseJSON(data[i]["json"]);
                var s = data[i]['length'].split(":")
                var total = (+s[0]) * 60 * 60 + (+s[1]) * 60 + (+s[2]);
                var current = parseInt(data[i]['timestamp']);
                var p = parseInt((current / total) * 100);
                var txt = "<div class=\"col index-card-col\"><div class=\"card index-card h-100\" onclick=\"playvid('"+data[i].id+"')\" role=\"button\" tabindex=\"0\" aria-label=\"Resume: "+data[i].title+"\">";
                txt += "<div class=\"index-card-thumb-wrap\"><img src=\"/api/images/"+data[i].id+"\" class=\"card-img-top index-card-thumb\" alt=\"Thumbnail\">";
                txt += "<div class=\"index-card-overlay\"><svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' fill='white' viewBox='0 0 16 16'><path d='M11.596 8.697l-6.363 3.692A.5.5 0 0 1 4.5 12V4a.5.5 0 0 1 .733-.441l6.363 3.692a.5.5 0 0 1 0 .882z'/></svg></div>";
                txt += "<div class=\"index-resume-bar\"><div class=\"index-resume-fill\" style=\"width:"+p+"%\"></div></div>";
                txt += "</div>";
                txt += "<div class=\"card-body\"><h5 class=\"card-title\">"+data[i].title+"</h5>";
                txt += "<p class=\"index-card-channel\"><a href='/creator.html?creator="+data[i]['channelId']+"'>"+data[i]['youtuber']+"</a></p>";
                txt += "</div><div class=\"card-footer\"><small>Published: "+data[i].PublishedAt+"</small></div></div></div>";
                $("#resumedeck").append(txt);
            });
        }
    }

    function contentChange(){
            update(currentId);
    }

    function paginationWithTotal(current, totalItems) {
        $("#pagelist").empty();
        var totalPages = Math.ceil(totalItems / 40);
        if (totalItems === 0) totalPages = 1;
        
        var txt = "";

        function pageItem(page, label = page, active = false, disabled = false) {
            return `<li class="page-item${active ? ' active' : ''}${disabled ? ' disabled' : ''}">
                <a class="page-link" href="#" onclick="update(${page});return false;">${label}</a>
            </li>`;
        }

        txt += current == 1 ? pageItem(current - 1, "Previous", false, true) : pageItem(current - 1, "Previous");

        var startPage = Math.max(1, current - 2);
        var endPage = Math.min(totalPages, current + 2);

        if (endPage - startPage < 4) {
            if (startPage == 1) {
                endPage = Math.min(totalPages, startPage + 4);
            } else if (endPage == totalPages) {
                startPage = Math.max(1, endPage - 4);
            }
        }

        if (startPage > 1) {
            txt += pageItem(1);
            if (startPage > 2) txt += '<li class="page-item disabled"><a class="page-link">...</a></li>';
        }

        for (var i = startPage; i <= endPage; i++) {
            txt += pageItem(i, i, i === current);
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) txt += '<li class="page-item disabled"><a class="page-link">...</a></li>';
            txt += pageItem(totalPages);
        }

        txt += current == totalPages ? pageItem(current + 1, "Next", false, true) : pageItem(current + 1, "Next");

        $("#pagelist").append(txt);
    }

    function toggleAdvancedFilters() {
        var filtersDiv = document.getElementById('advancedFilters');
        var showBtn = document.getElementById('showAdvancedBtn');
        if (filtersDiv.style.display === 'none') {
            filtersDiv.style.display = 'block';
            showBtn.textContent = 'Hide Filters';
            loadChannelOptions();
        } else {
            filtersDiv.style.display = 'none';
            showBtn.textContent = 'Show Advanced Filters';
        }
    }

    function loadChannelOptions() {
        $.getJSON('/api/channels/0', function(data) {
            var select = $('#channelFilter');
            select.empty();
            $.each(data, function(i, item) {
                select.append($('<option></option>').val(item.channelid).text(item.channelname));
            });
        });
    }

    function setDatePreset(preset) {
        var now = new Date();
        var fromDate = new Date();
        var toDate = new Date();
        
        switch(preset) {
            case 'today':
                fromDate.setHours(0,0,0,0);
                break;
            case 'week':
                fromDate.setDate(now.getDate() - 7);
                break;
            case 'month':
                fromDate.setMonth(now.getMonth() - 1);
                break;
            case 'year':
                fromDate.setFullYear(now.getFullYear() - 1);
                break;
        }
        
        $('#fromDate').val(toISOStringDate(fromDate));
        $('#toDate').val(toISOStringDate(toDate));
        applyFilters();
    }

    function toISOStringDate(date) {
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }

    function clearDatePreset() {
        $('#fromDate').val('');
        $('#toDate').val('');
        applyFilters();
    }

    function clearFilters() {
        activeFilters.channel_ids = [];
        activeFilters.from_date = '';
        activeFilters.to_date = '';
        activeFilters.min_duration = null;
        activeFilters.max_duration = null;
        $('#channelFilter').val([]);
        $('#fromDate').val('');
        $('#toDate').val('');
        $('#durationFilter').val('');
        update(currentId);
    }

    function applyFilters() {
        activeFilters.channel_ids = $('#channelFilter').val() || [];
        activeFilters.from_date = $('#fromDate').val();
        activeFilters.to_date = $('#toDate').val();
        
        var durationVal = $('#durationFilter').val();
        activeFilters.min_duration = null;
        activeFilters.max_duration = null;
        
        if (durationVal === '<5') {
            activeFilters.max_duration = 300;
        } else if (durationVal === '5-10') {
            activeFilters.min_duration = 300;
            activeFilters.max_duration = 600;
        } else if (durationVal === '10-30') {
            activeFilters.min_duration = 600;
            activeFilters.max_duration = 1800;
        } else if (durationVal === '30-60') {
            activeFilters.min_duration = 1800;
            activeFilters.max_duration = 3600;
        } else if (durationVal === '>60') {
            activeFilters.min_duration = 3600;
        }
        
        update(currentId);
    }
</script>
{% endblock %}
