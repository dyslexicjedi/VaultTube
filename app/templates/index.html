{% extends "base.html" %}
{% block content %}

<!-- Animated background orbs -->
<div class="index-orb index-orb-1" aria-hidden="true"></div>
<div class="index-orb index-orb-2" aria-hidden="true"></div>

<!-- Resume Section -->
<section class="index-section" id="resumeSection" style="display:none;">
    <div class="index-section-header">
        <h5 id="resumelabel" class="index-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-2" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M11.596 8.697l-6.363 3.692A.5.5 0 0 1 4.5 12V4a.5.5 0 0 1 .733-.441l6.363 3.692a.5.5 0 0 1 0 .882z"/>
            </svg>
            Resume
        </h5>
    </div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="resumedeck"></div>
</section>

<!-- Latest Section -->
<section class="index-section">
    <div class="index-section-header">
        <h5 id="latestlabel" class="index-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-2" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
            </svg>
            Latest
        </h5>
        <div class="index-filters">
            <div class="index-filter-pill">
                <span class="index-filter-label">Unwatched</span>
                <div class="form-check form-switch index-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="contentToggle" onclick="contentChange();" aria-label="Toggle content filter">
                    <label class="form-check-label" for="contentToggle"></label>
                </div>
                <span class="index-filter-label">All</span>
            </div>
            <div class="index-filter-pill">
                <span class="index-filter-label">Published</span>
                <div class="form-check form-switch index-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="dateToggle" onclick="contentChange();" aria-label="Toggle date sort">
                    <label class="form-check-label" for="dateToggle"></label>
                </div>
                <span class="index-filter-label">Added</span>
            </div>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="carddeck"></div>
    <nav aria-label="Video page navigation" class="pt-4 pb-2 d-flex justify-content-center">
        <ul id="pagelist" class="pagination index-pagination" style="gap: 0.4rem;"></ul>
    </nav>
</section>

<script src="/static/js/scripts.js"></script>
<script>

    update(1);
    function update(id){
        currentId = id;
        let totalCount = 0;
        if($("#dateToggle").prop('checked')){
            sortRelease='AddedAt'
        }
        else{
            sortRelease='PublishedAt'
        }
        
        if($("#contentToggle").prop('checked')){
            $.get("/api/stats/video/count",function(data){
                totalCount = parseInt(data);
                let totalPages = Math.ceil(totalCount / 40);
                pagination(id, totalPages);
            });
            $.getJSON("/api/getvids/all/"+sortRelease+"/desc/"+((id-1)*40),function(data){
                processdata(data);
            });
        } else {
            $.get("/api/stats/video/unwatched",function(data){
                totalCount = parseInt(data);
                let totalPages = Math.ceil(totalCount / 40);
                pagination(id, totalPages);
            });
            $.getJSON("/api/getvids/unwatched/"+sortRelease+"/desc/"+((id-1)*40),function(data){
                processdata(data);
            });
        }
    }

    $.getJSON("/api/list/resume/",function(data){
        processresume(data);
    });

    function processresume(data){
        if(data.length > 0){
            $("#resumeSection").fadeIn(300);
            $("#resumedeck").empty();
            $.each(data,function(i,item){
                var jobj = jQuery.parseJSON(data[i]["json"]);
                var s = data[i]['length'].split(":")
                var total = (+s[0]) * 60 * 60 + (+s[1]) * 60 + (+s[2]);
                var current = parseInt(data[i]['timestamp']);
                var p = parseInt((current / total) * 100);
                var txt = "<div class=\"col index-card-col\"><div class=\"card index-card h-100\" onclick=\"playvid('"+data[i].id+"')\" role=\"button\" tabindex=\"0\" aria-label=\"Resume: "+data[i].title+"\">";
                txt += "<div class=\"index-card-thumb-wrap\"><img src=\"/api/images/"+data[i].id+"\" class=\"card-img-top index-card-thumb\" alt=\"Thumbnail\">";
                txt += "<div class=\"index-card-overlay\"><svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' fill='white' viewBox='0 0 16 16'><path d='M11.596 8.697l-6.363 3.692A.5.5 0 0 1 4.5 12V4a.5.5 0 0 1 .733-.441l6.363 3.692a.5.5 0 0 1 0 .882z'/></svg></div>";
                txt += "<div class=\"index-resume-bar\"><div class=\"index-resume-fill\" style=\"width:"+p+"%\"></div></div>";
                txt += "</div>";
                txt += "<div class=\"card-body\"><h5 class=\"card-title\">"+data[i].title+"</h5>";
                txt += "<p class=\"index-card-channel\"><a href='/creator.html?creator="+data[i]['channelId']+"'>"+data[i]['youtuber']+"</a></p>";
                txt += "</div><div class=\"card-footer\"><small>Published: "+data[i].PublishedAt+"</small></div></div></div>";
                $("#resumedeck").append(txt);
            });
        }
    }

    function contentChange(){
            update(currentId);
    }
</script>
{% endblock %}
