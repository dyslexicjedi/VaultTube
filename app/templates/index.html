{% extends "base.html" %}
{% block content %}

<!-- Hero: most recently added unwatched video -->
<section class="vt-hero" id="hero" hidden>
    <div class="vt-hero-backdrop"><img id="hero-img" src="" alt=""></div>
    <div class="vt-hero-shade"></div>
    <div class="vt-hero-content">
        <div class="vt-hero-kicker">Newest addition</div>
        <h1 class="vt-hero-title" id="hero-title"></h1>
        <div class="vt-hero-meta" id="hero-meta"></div>
        <div class="vt-hero-actions">
            <a class="vt-btn" id="hero-play" href="#">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Play
            </a>
            <a class="vt-btn-ghost" id="hero-channel" href="#">View channel</a>
        </div>
    </div>
</section>

<section class="vt-section" id="resume-section" hidden>
    <div class="vt-rail-header">
        <h2>Continue watching</h2>
    </div>
    <div class="vt-rail-track" id="resume-rail"></div>
</section>

<section class="vt-section" id="new-section" hidden>
    <div class="vt-rail-header">
        <h2>New this week</h2>
        <span class="vt-sub" id="new-sub"></span>
        <a class="vt-all" href="/browse.html">Browse all</a>
    </div>
    <div class="vt-rail-track" id="new-rail"></div>
</section>

<div id="channel-rails"></div>

<div class="vt-empty" id="home-empty" hidden>
    Nothing unwatched right now — you're all caught up.
    <div style="margin-top:16px"><a class="vt-btn-ghost" href="/browse.html">Browse the vault</a></div>
</div>

<script src="/static/js/cards.js"></script>
<script>
(function () {
    var sectionsWithContent = 0;

    function show(id) {
        document.getElementById(id).hidden = false;
        sectionsWithContent++;
    }

    function getJSON(url) {
        return fetch(url).then(function (r) { return r.json(); });
    }

    // Hero + "New this week" share nothing; fire everything in parallel
    var heroDone = getJSON('/api/getvids/unwatched/AddedAt/desc/0').then(function (vids) {
        if (!vids.length) return;
        var v = vids[0];
        document.getElementById('hero-img').src = '/api/images/' + encodeURIComponent(v.id);
        document.getElementById('hero-title').textContent = v.title;
        var meta = [];
        if (v.youtuber) meta.push('<a href="/creator.html?creator=' + encodeURIComponent(v.channelId) + '">' + VT.esc(v.youtuber) + '</a>');
        if (v.PublishedAt) meta.push(VT.esc(VT.fmtDate(v.PublishedAt)));
        if (v.length) meta.push(VT.esc(VT.fmtDur(v.length)));
        document.getElementById('hero-meta').innerHTML = meta.join(' &nbsp;·&nbsp; ');
        document.getElementById('hero-play').href = '/player.html?id=' + encodeURIComponent(v.id);
        var ch = document.getElementById('hero-channel');
        if (v.channelId) ch.href = '/creator.html?creator=' + encodeURIComponent(v.channelId);
        else ch.hidden = true;
        show('hero');
    });

    var resumeDone = getJSON('/api/list/resume/').then(function (vids) {
        if (!vids.length) return;
        VT.render(document.getElementById('resume-rail'), vids, { progress: true });
        show('resume-section');
    });

    var weekAgo = new Date(Date.now() - 7 * 86400 * 1000);
    var fromDate = weekAgo.getFullYear() + '-'
        + String(weekAgo.getMonth() + 1).padStart(2, '0') + '-'
        + String(weekAgo.getDate()).padStart(2, '0');
    var newDone = getJSON('/api/getvids/unwatched/PublishedAt/desc/0?from_date=' + fromDate).then(function (vids) {
        if (!vids.length) return;
        document.getElementById('new-sub').textContent = vids.length >= 40 ? '40+ videos' : vids.length + (vids.length === 1 ? ' video' : ' videos');
        VT.render(document.getElementById('new-rail'), vids, { dot: true });
        show('new-section');
    });

    // One rail per active channel that still has something unwatched
    var railsDone = getJSON('/api/channels/0?order=activity').then(function (channels) {
        var top = channels.filter(function (c) { return parseInt(c.unwatched, 10) > 0; }).slice(0, 4);
        if (!top.length) return;
        return Promise.all(top.map(function (c) {
            return getJSON('/api/getvids/unwatched/PublishedAt/desc/0?channel_ids[]=' + encodeURIComponent(c.channelid));
        })).then(function (lists) {
            var host = document.getElementById('channel-rails');
            top.forEach(function (c, i) {
                if (!lists[i].length) return;
                var section = document.createElement('section');
                section.className = 'vt-section';
                section.innerHTML =
                    '<div class="vt-rail-header"><h2>' + VT.esc(c.channelname) + '</h2>'
                    + '<span class="vt-sub">' + VT.esc(c.unwatched) + ' unwatched</span>'
                    + '<a class="vt-all" href="/creator.html?creator=' + encodeURIComponent(c.channelid) + '">View all</a></div>'
                    + '<div class="vt-rail-track"></div>';
                VT.render(section.querySelector('.vt-rail-track'), lists[i].slice(0, 12), {});
                host.appendChild(section);
                sectionsWithContent++;
            });
        });
    });

    Promise.allSettled([heroDone, resumeDone, newDone, railsDone]).then(function () {
        if (sectionsWithContent === 0) document.getElementById('home-empty').hidden = false;
    });
})();
</script>
{% endblock %}
