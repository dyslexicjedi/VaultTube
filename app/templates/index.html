{% extends "base.html" %}
{% block content %}

<div><h5 id="resumelabel"></h5></div>
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="resumedeck"></div>
<hr>
<div class="row mb-3 align-items-center">
    <div class="col"><h5 id="latestlabel">Latest</h5></div>
    <div class="col-auto">
        <div class="d-flex align-items-center">
            <span class="form-text me-2">Unwatched</span>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="contentToggle" onclick="contentChange();" aria-label="Toggle content filter">
                <label class="form-check-label" for="contentToggle"></label>
            </div>
            <span class="form-text ms-2">All</span>
        </div>
    </div>
    <div class="col-auto">
        <div class="d-flex align-items-center">
            <span class="form-text me-2">Published</span>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="dateToggle" onclick="contentChange();" aria-label="Toggle content filter">
                <label class="form-check-label" for="dateToggle"></label>
            </div>
            <span class="form-text ms-2">Added</span>
        </div>
    </div>
</div>
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="carddeck"></div>
<nav aria-label="Page navigation example" class="pt-4 pb-4 d-flex justify-content-center">
    <ul id="pagelist" class="pagination" style="gap: 0.5rem;"></ul>
</nav>

<script src="/static/js/scripts.js"></script>
<script>

    update(1);
    function update(id){
        currentId = id;
        let totalCount = 0;
        if($("#dateToggle").prop('checked')){
            sortRelease='AddedAt'
        }
        else{
            sortRelease='PublishedAt'
        }
        
        if($("#contentToggle").prop('checked')){
            // All videos count
            $.get("/api/stats/video/count",function(data){
                totalCount = parseInt(data);
                let totalPages = Math.ceil(totalCount / 40);
                pagination(id, totalPages);
            });
            $.getJSON("/api/getvids/all/"+sortRelease+"/desc/"+((id-1)*40),function(data){
                processdata(data);
            });
        } else {
            // Unwatched videos count
            $.get("/api/stats/video/unwatched",function(data){
                totalCount = parseInt(data);
                let totalPages = Math.ceil(totalCount / 40);
                pagination(id, totalPages);
            });
            $.getJSON("/api/getvids/unwatched/"+sortRelease+"/desc/"+((id-1)*40),function(data){
                processdata(data);
            });
        }

    }
    $.getJSON("/api/list/resume/",function(data){
        processresume(data);
    });
    function processresume(data){
        if(data.length > 0){
            $("#resumelabel").text("Resume");
            $("#resumedeck").empty();
            $.each(data,function(i,item){
                var jobj = jQuery.parseJSON(data[i]["json"]);
                var txt = "<div class=\"col\"><div class=\"card h-100\" onclick=\"playvid('"+data[i].id+"')\" role=\"button\" tabindex=\"0\" aria-label=\"Play video: "+data[i].title+"\"><img src=\"/api/images/"+data[i].id+"\" class=\"card-img-top img-fluid\" alt=\"Thumbnail\">";
                //Progress Bar Math
                var s = data[i]['length'].split(":")
                var total = (+s[0]) * 60 * 60 + (+s[1]) * 60 + (+s[2]);
                var current = parseInt(data[i]['timestamp']);
                var p = parseInt((current / total)*100);
                txt += "<div class=\"progress\"><div class=\"progress-bar progress-bar-striped bg-info\" role=\"progressbar\" style=\"width: "+p+"%\" aria-valuenow=\""+p+"\" aria-valuemin=\"0\" aria-valuemax=\"100\"></div></div>";
                txt +="<div class=\"card-body\"><h5 class=\"card-title\">"+data[i].title+"</h5>";
                txt += "<p><a href='/creator.html?creator="+data[i]['channelId']+"'>"+data[i]['youtuber']+"</a></p>";
                txt += "</div><div class=\"card-footer\"><small class=\"text-muted\">Published: "+data[i].PublishedAt+"</small></div></div></div>";
                $("#resumedeck").append(txt);
            });
        }
    }
    function contentChange(){
            update(currentId);
    }
</script>
{% endblock %}
