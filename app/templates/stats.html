{% extends "base.html" %}
{% block content %}

<div class="vt-rail-header" style="margin-bottom:18px">
    <h2>Stats</h2>
</div>

<div class="vt-stat-grid">
    <div class="vt-stat">
        <span class="vt-stat-label">Total videos</span>
        <span class="vt-stat-value" id="stat-total">—</span>
    </div>
    <div class="vt-stat">
        <span class="vt-stat-label">Unwatched</span>
        <span class="vt-stat-value" id="stat-unwatched">—</span>
    </div>
    <div class="vt-stat">
        <span class="vt-stat-label">Watched</span>
        <span class="vt-stat-value" id="stat-watched">—</span>
    </div>
    <div class="vt-stat">
        <span class="vt-stat-label">Avg. video length</span>
        <span class="vt-stat-value" id="stat-avglength">—</span>
    </div>

    <div class="vt-chart" style="grid-column:span 2">
        <span class="vt-stat-label" style="margin-bottom:12px">Watched vs unwatched</span>
        <div class="vt-chart-wrap"><canvas id="watchedChart"></canvas></div>
    </div>
    <div class="vt-chart" style="grid-column:span 2">
        <span class="vt-stat-label" style="margin-bottom:12px">Deleted from source vs still up</span>
        <div class="vt-chart-wrap"><canvas id="deletedChart"></canvas></div>
    </div>
    <div class="vt-chart wide">
        <span class="vt-stat-label" style="margin-bottom:12px">Videos by channel</span>
        <div class="vt-chart-wrap"><canvas id="channelChart"></canvas></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script>
(function () {
    var ACCENT = '#e6a23c';
    var DIM = '#9aa0a6';
    var GRID = 'rgba(255,255,255,0.06)';
    var legendLabels = { color: '#e8eaed', font: { family: 'Inter, sans-serif', size: 12 }, padding: 16 };

    // API shapes: totalcount [[n]], watched/deleted [[flag,count],...], countbyyoutuber [[name,count],...]
    function flagCounts(arr) {
        var obj = {};
        (arr || []).forEach(function (pair) { obj[pair[0]] = pair[1]; });
        return obj;
    }

    function secondsToHms(d) {
        d = Number(d);
        if (isNaN(d) || d <= 0) return '—';
        var h = Math.floor(d / 3600);
        var m = Math.floor((d % 3600) / 60);
        var s = Math.floor(d % 60);
        return (h > 0 ? h + ':' : '') + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    fetch('/api/stats').then(function (r) { return r.json(); }).then(function (data) {
        var watched = flagCounts(data.watched);
        document.getElementById('stat-total').textContent = (data.totalcount[0] || [0])[0];
        document.getElementById('stat-unwatched').textContent = watched[0] || 0;
        document.getElementById('stat-watched').textContent = watched[1] || 0;
        document.getElementById('stat-avglength').textContent = secondsToHms((data.avg_length_seconds[0] || [0])[0]);

        new Chart(document.getElementById('watchedChart'), {
            type: 'doughnut',
            data: {
                labels: ['Watched', 'Unwatched'],
                datasets: [{
                    data: [watched[1] || 0, watched[0] || 0],
                    backgroundColor: ['rgba(154,160,166,0.55)', 'rgba(230,162,60,0.8)'],
                    borderColor: '#14171c',
                    borderWidth: 3,
                    hoverOffset: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: legendLabels } }
            }
        });

        var deleted = flagCounts(data.deleted);
        new Chart(document.getElementById('deletedChart'), {
            type: 'doughnut',
            data: {
                labels: ['Still up', 'Deleted from source'],
                datasets: [{
                    data: [deleted[0] || 0, deleted[1] || 0],
                    backgroundColor: ['rgba(230,162,60,0.8)', 'rgba(248,81,73,0.7)'],
                    borderColor: '#14171c',
                    borderWidth: 3,
                    hoverOffset: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: legendLabels } }
            }
        });

        var byChannel = (data.countbyyoutuber || []).slice().sort(function (a, b) { return b[1] - a[1]; });
        new Chart(document.getElementById('channelChart'), {
            type: 'bar',
            data: {
                labels: byChannel.map(function (x) { return x[0]; }),
                datasets: [{
                    data: byChannel.map(function (x) { return x[1]; }),
                    backgroundColor: 'rgba(230,162,60,0.65)',
                    borderColor: ACCENT,
                    borderWidth: 1,
                    borderRadius: 5,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: DIM, font: { family: 'Inter, sans-serif' } }, grid: { color: GRID } },
                    y: { ticks: { color: DIM, font: { family: 'Inter, sans-serif' } }, grid: { color: GRID }, beginAtZero: true }
                }
            }
        });
    });
})();
</script>
{% endblock %}
