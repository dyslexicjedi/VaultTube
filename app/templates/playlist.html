{% extends "base.html" %}
{% block content %}

<div class="vt-page-head">
    <h1 id="playlist-name"></h1>
    <button type="button" class="vt-sub-btn" id="playlist-sub" hidden></button>
</div>

<div class="vt-grid" id="playlist-grid"></div>
<div class="vt-empty" id="playlist-empty" hidden>No videos in this playlist yet.</div>
<ul class="vt-pages" id="playlist-pages"></ul>

<script src="/static/js/cards.js"></script>
<script>
(function () {
    var playlist = new URLSearchParams(window.location.search).get('playlist');
    document.getElementById('playlist-name').textContent = playlist;

    function load(p) {
        fetch('/api/playlist/' + encodeURIComponent(playlist) + '/' + ((p - 1) * 40))
            .then(function (r) { return r.json(); })
            .then(function (vids) {
                if (vids.length && vids[0].playlistName) {
                    document.getElementById('playlist-name').textContent = vids[0].playlistName;
                    document.title = vids[0].playlistName + ' — VaultTube';
                }
                VT.render(document.getElementById('playlist-grid'), vids, { dot: true });
                document.getElementById('playlist-empty').hidden = vids.length > 0;
                VT.pager(document.getElementById('playlist-pages'), { page: p, hasNext: vids.length === 40, onPage: load });
                window.scrollTo({ top: 0 });
            });
    }

    // Subscribe toggle
    var subBtn = document.getElementById('playlist-sub');
    function setSub(on) {
        subBtn.hidden = false;
        subBtn.classList.toggle('on', on);
        subBtn.textContent = on ? '✓ Subscribed' : '+ Subscribe';
        subBtn.dataset.on = on ? '1' : '0';
    }
    fetch('/api/sub_status/playlist/' + encodeURIComponent(playlist))
        .then(function (r) { return r.text(); })
        .then(function (txt) {
            if (txt === '0' || txt === '1') setSub(txt === '1');
        });
    subBtn.addEventListener('click', function () {
        var on = subBtn.dataset.on === '1';
        fetch('/api/' + (on ? 'unsubscribe' : 'subscribe') + '/playlist/' + encodeURIComponent(playlist))
            .then(function () { setSub(!on); });
    });

    load(1);
})();
</script>
{% endblock %}
