{% extends "base.html" %}
{% block content %}

<div class="vt-rail-header" style="margin-bottom:18px">
    <h2>Playlists</h2>
    <a class="vt-all" href="#" id="playlist-add">+ Add playlist</a>
</div>

<div class="vt-tile-grid" id="playlists-grid"></div>
<div class="vt-empty" id="playlists-empty" hidden>No playlists yet — add one to start archiving it.</div>
<ul class="vt-pages" id="playlists-pages"></ul>

<div class="vt-modal-backdrop" id="playlist-modal" hidden>
    <div class="vt-modal" role="dialog" aria-labelledby="playlist-modal-title">
        <h3 id="playlist-modal-title">Add playlist</h3>
        <p class="vt-modal-text">Paste a YouTube playlist ID or link. It is added to your subscriptions and scanned for new videos.</p>
        <input type="text" class="vt-input" id="playlist-entry" placeholder="PL… or youtube.com/playlist?list=…" style="width:100%">
        <div class="vt-modal-actions" style="margin-top:16px">
            <span class="vt-modal-status" id="playlist-status"></span>
            <button type="button" class="vt-btn-ghost" id="playlist-cancel">Cancel</button>
            <button type="button" class="vt-btn" id="playlist-save">Add</button>
        </div>
    </div>
</div>

<script src="/static/js/cards.js"></script>
<script>
(function () {
    function $id(x) { return document.getElementById(x); }
    var page = 1;

    function tileHTML(pl) {
        var desc = '';
        try {
            var jobj = JSON.parse(pl.json);
            desc = (jobj.items && jobj.items[0] && jobj.items[0].snippet && jobj.items[0].snippet.description) || '';
        } catch (e) {}
        var subbed = String(pl.subscribed) === '1';
        return '<div class="vt-tile">'
            + '<a class="vt-tile-name" href="/playlist.html?playlist=' + encodeURIComponent(pl.playlistId) + '">' + VT.esc(pl.playlistName) + '</a>'
            + '<p class="vt-tile-desc">' + VT.esc(desc) + '</p>'
            + '<div class="vt-tile-foot"><div class="vt-actions">'
            + '<button type="button" class="vt-sub-btn' + (subbed ? ' on' : '') + '" data-playlist="' + VT.esc(pl.playlistId) + '">' + (subbed ? '✓ Subscribed' : '+ Subscribe') + '</button>'
            + '</div></div></div>';
    }

    function load(p) {
        page = p;
        fetch('/api/playlists/' + ((p - 1) * 40))
            .then(function (r) { return r.json(); })
            .then(function (playlists) {
                $id('playlists-grid').innerHTML = playlists.map(tileHTML).join('');
                $id('playlists-empty').hidden = playlists.length > 0;
                VT.pager($id('playlists-pages'), { page: p, hasNext: playlists.length === 40, onPage: load });
            });
    }

    $id('playlists-grid').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-playlist]');
        if (!btn) return;
        var id = btn.dataset.playlist;
        var subbed = btn.classList.contains('on');
        fetch('/api/' + (subbed ? 'unsubscribe' : 'subscribe') + '/playlist/' + encodeURIComponent(id))
            .then(function () {
                btn.classList.toggle('on', !subbed);
                btn.textContent = subbed ? '+ Subscribe' : '✓ Subscribed';
            });
    });

    // Add-playlist modal
    function openModal(e) {
        e.preventDefault();
        $id('playlist-status').textContent = '';
        $id('playlist-modal').hidden = false;
        $id('playlist-entry').focus();
    }
    function closeModal() { $id('playlist-modal').hidden = true; }
    $id('playlist-add').addEventListener('click', openModal);
    $id('playlist-cancel').addEventListener('click', closeModal);
    $id('playlist-modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

    $id('playlist-save').addEventListener('click', function () {
        var raw = $id('playlist-entry').value.trim();
        if (!raw) return;
        // Accept a full URL and pull the list= parameter out of it
        var m = raw.match(/[?&]list=([^&]+)/);
        var plid = m ? m[1] : raw;
        var status = $id('playlist-status');
        status.textContent = 'Adding…';
        status.className = 'vt-modal-status';
        fetch('/api/subscribe/playlist/' + encodeURIComponent(plid))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.success) {
                    status.textContent = 'Added ✓';
                    status.className = 'vt-modal-status ok';
                    $id('playlist-entry').value = '';
                    load(page);
                } else {
                    status.textContent = 'Failed: ' + data.error;
                    status.className = 'vt-modal-status err';
                }
            })
            .catch(function (err) {
                status.textContent = 'Request failed: ' + err;
                status.className = 'vt-modal-status err';
            });
    });
    $id('playlist-entry').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') $id('playlist-save').click();
    });

    load(1);
})();
</script>
{% endblock %}
