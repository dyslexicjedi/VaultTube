{% extends "base.html" %}
{% block content %}


<div class="toprow"><img id="subimg"><h3 id="creatorlabel"></h3></div>
<div class="row row-cols-3 row-cols-md-4 g-4" id="carddeck"></div>
<nav aria-label="..." class="pt-4 pb-4">
    <ul id="pagelist" class="pagination"></ul>
</nav>

<script src="/static/js/scripts.js"></script>
<script>
const querystring = window.location.search;
const urlparams = new URLSearchParams(querystring);
const creator = urlparams.get('creator');
var currentId = 1;
update(1);
subscribe_status(creator);
function update(id){
    currentId = id;
    get_videos(id-1, creator).then(() => {
        get_creator_count(creator).then(totalCount => {
            const totalPages = Math.ceil(totalCount / 40);
            pagination(id, totalPages);
        });
    });
}
$("#creatorlabel").text(creator);
function get_videos(currentpage, creator){
    return $.getJSON("/api/creator/" + creator + "/" + currentpage, function(data){
        $("#creatorlabel").text(data[0]['youtuber']);
        processdata(data);
    });
}
function contentChange(){
    update(currentId);
}
function get_creator_count(creator) {
    return $.getJSON('/api/creator/count/' + creator).then(data => data.count);
}
</script>
{% endblock %}
