{% extends "base.html" %}
{% block content %}

<h3>Random</h3>
<div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" id="includeReddit" onchange="contentChange()">
    <label class="form-check-label" for="includeReddit">Include Reddit</label>
</div>
<div class="row row-cols-3 row-cols-md-4 g-4" id="carddeck"></div>

<script src="/static/js/scripts.js"></script>
<script>
var currentId = 1;
update(1);
function update(id){
    currentId = id;
    get_videos(id-1);
    pagination(id);
}
function get_videos(currentpage){
    var includeReddit = document.getElementById('includeReddit').checked ? 1 : 0;
    $.getJSON("/api/random?include_reddit="+includeReddit,function(data){
        processdata(data);
    });
}
function contentChange(){
    update(currentId);
}
</script>
{% endblock %}
