{% extends "base.html" %}
{% block content %}

<div class="vt-rail-header" style="margin-bottom:18px">
    <h2>Random</h2>
    <span class="vt-sub">40 videos from the vault</span>
</div>

<div class="vt-filterbar">
    <div class="vt-field">
        <label>Sources</label>
        <div class="vt-seg" id="reddit-seg">
            <button type="button" data-value="0" class="active">YouTube &amp; Patreon</button>
            <button type="button" data-value="1">Include Reddit</button>
        </div>
    </div>
    <div class="vt-actions">
        <button type="button" class="vt-btn" id="shuffle-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            Shuffle again
        </button>
    </div>
</div>

<div class="vt-grid" id="random-grid"></div>

<script src="/static/js/cards.js"></script>
<script>
(function () {
    var includeReddit = '0';

    function load() {
        fetch('/api/random?include_reddit=' + includeReddit)
            .then(function (r) { return r.json(); })
            .then(function (vids) {
                VT.render(document.getElementById('random-grid'), vids, { dot: true });
                window.scrollTo({ top: 0 });
            });
    }

    var seg = document.getElementById('reddit-seg');
    seg.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-value]');
        if (!btn || btn.classList.contains('active')) return;
        seg.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        includeReddit = btn.dataset.value;
        load();
    });

    document.getElementById('shuffle-btn').addEventListener('click', load);
    load();
})();
</script>
{% endblock %}
