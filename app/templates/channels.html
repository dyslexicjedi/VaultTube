{% extends "base.html" %}
{% block content %}

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 pt-4" id="carddeck"></div>

<nav aria-label="Channel pagination" class="pt-4 pb-4 d-flex justify-content-center">
    <ul id="pagelist" class="pagination pagination-sm" style="gap: 0.5rem;"></ul>
</nav>

<script src="/static/js/scripts.js"></script>
<script>
    update(1);
    function update(id){
        get_channels(id-1);
        pagination(id);
    }
    function get_channels(currentpage){
        $.getJSON("/api/channels/"+(currentpage*40),function(data){
            processdata(data);
        });
    }
    function processdata(data){
        $("#carddeck").empty();
        $.each(data,function(i,item){
            var jobj = jQuery.parseJSON(data[i]["json"]);
            var desc = jobj['items'][0]['snippet']['description'] || '';
            var txt = `
                <div class="col">
                  <div class="card h-100 shadow-sm border-0">
                    <div class="card-body d-flex flex-column">
                      <h5 class="card-title"><a href="creator.html?creator=${data[i]['channelid']}" class="stretched-link text-decoration-none">${data[i]['channelname']}</a></h5>
                      <p class="card-text text-truncate-3">${desc}</p>
                    </div>
                    <div class="card-footer bg-transparent border-top d-flex justify-content-between align-items-center">
                        <div>
                          <button class="btn btn-${data[i]['subscribed'] ? 'outline-secondary' : 'primary'} btn-sm" onclick="${data[i]['subscribed'] ? `unsubscribe('${data[i]['channelid']}')` : `subscribe('${data[i]['channelid']}')`}">
                            ${data[i]['subscribed'] ? 'Subscribed' : 'Subscribe'}
                          </button>
                        </div>
                        <small class="text-muted">
                          Videos: ${data[i]['vidcount']}<br>
                          Last Archived: ${data[i]['lastvidtime']}
                        </small>
                    </div>
                  </div>
                </div>
            `;
            $("#carddeck").append(txt);
        });
    }
</script>

<style>
.text-truncate-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;  
    overflow: hidden;
}
</style>

{% endblock %}
