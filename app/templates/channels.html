{% extends "base.html" %}
{% block content %}

<div class="vt-rail-header" style="margin-bottom:18px">
    <h2>Channels</h2>
    <span class="vt-sub" id="channels-count"></span>
</div>

<div class="vt-tile-grid" id="channels-grid"></div>
<div class="vt-empty" id="channels-empty" hidden>No channels yet — download something first.</div>
<ul class="vt-pages" id="channels-pages"></ul>

<script src="/static/js/cards.js"></script>
<script>
(function () {
    var page = 1;

    function channelSource(c) {
        if (c.source) return c.source;
        // Empty channels: fall back to the ID shape (same heuristic as /api/channel)
        if (c.channelid.indexOf('UC') === 0) return 'youtube';
        if (/^\d+$/.test(c.channelid)) return 'patreon';
        return 'reddit';
    }

    function tileHTML(c) {
        var desc = '';
        try {
            // json shape differs by source (YouTube API vs Patreon); missing
            // description must not break the page
            var jobj = JSON.parse(c.json);
            desc = (jobj.items && jobj.items[0] && jobj.items[0].snippet && jobj.items[0].snippet.description) || jobj.description || '';
        } catch (e) {}
        var unwatched = parseInt(c.unwatched, 10) || 0;
        var subbed = String(c.subscribed) === '1';
        var src = channelSource(c);
        var srcLabel = { youtube: 'YouTube', patreon: 'Patreon', reddit: 'Reddit' }[src] || src;
        return '<div class="vt-tile src-' + VT.esc(src) + '">'
            + '<a class="vt-tile-name" href="/creator.html?creator=' + encodeURIComponent(c.channelid) + '">' + VT.esc(c.channelname) + '</a>'
            + '<p class="vt-tile-desc">' + VT.esc(desc) + '</p>'
            + '<div class="vt-tile-foot">'
            + '<span class="vt-source-chip src-' + VT.esc(src) + '">' + VT.esc(srcLabel) + '</span>'
            + '<span class="vt-sub">' + VT.esc(c.vidcount) + ' videos</span>'
            + (unwatched ? '<span class="vt-chip">' + unwatched + ' unwatched</span>' : '')
            + (c.lastvidtime ? '<span class="vt-sub">Last: ' + VT.esc(VT.fmtDate(c.lastvidtime)) + '</span>' : '')
            + '<div class="vt-actions">'
            + '<button type="button" class="vt-sub-btn' + (subbed ? ' on' : '') + '" data-channel="' + VT.esc(c.channelid) + '">' + (subbed ? '✓ Subscribed' : '+ Subscribe') + '</button>'
            + '</div></div></div>';
    }

    function load(p) {
        page = p;
        fetch('/api/channels/' + ((p - 1) * 40))
            .then(function (r) { return r.json(); })
            .then(function (channels) {
                document.getElementById('channels-grid').innerHTML = channels.map(tileHTML).join('');
                document.getElementById('channels-empty').hidden = channels.length > 0;
                document.getElementById('channels-count').textContent = channels.length === 40 ? '' : channels.length + ' channels';
                VT.pager(document.getElementById('channels-pages'), { page: p, hasNext: channels.length === 40, onPage: load });
                window.scrollTo({ top: 0 });
            });
    }

    document.getElementById('channels-grid').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-channel]');
        if (!btn) return;
        var id = btn.dataset.channel;
        var subbed = btn.classList.contains('on');
        fetch('/api/' + (subbed ? 'unsubscribe' : 'subscribe') + '/channel/' + encodeURIComponent(id))
            .then(function () {
                btn.classList.toggle('on', !subbed);
                btn.textContent = subbed ? '+ Subscribe' : '✓ Subscribed';
            });
    });

    load(1);
})();
</script>
{% endblock %}
