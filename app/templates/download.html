{% extends "base.html" %}
{% block content %}
<div class="container-lg py-4">
    <h2 class="mb-4 text-primary fw-bold">YouTube Video Downloader</h2>
    <div class="input-group mb-4 shadow-sm rounded">
        <input id="yturl" type="text" class="form-control border-0" placeholder="Enter YouTube URL or ID" aria-label="Youtube URL" aria-describedby="yt-download-btn" style="height: 50px; font-size: 1.1rem;">
        <button class="btn btn-primary px-4" type="button" id="yt-download-btn" onclick="processdownload();">Download</button>
    </div>
</div>

<hr class="my-5">

<div class="container-lg py-4">
    <h2 class="mb-4 text-success fw-bold">Patreon Content Downloader</h2>
    <div class="row g-3 align-items-center mb-4">
        <div class="col-md-7">
            <input id="patreonurl" type="text" class="form-control shadow-sm" placeholder="Patreon Post URL" aria-label="Patreon URL">
        </div>
        <div class="col-md-4">
            <input id="patreonchannelid" type="text" class="form-control shadow-sm" placeholder="Destination Channel ID" aria-label="Destination Channel ID">
        </div>
        <div class="col-md-1 d-grid">
            <button class="btn btn-success" type="button" onclick="processPatreonDownload();">Download</button>
        </div>
    </div>
</div>

<hr class="my-5">
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4" id="carddeck"></div>
<div class="container-lg pb-4">
    <h4 class="mb-3 fw-semibold d-flex align-items-center gap-2">
      Download Queue Length:
      <span id="queuelength" class="badge bg-secondary fs-5">0</span>
    </h4>

    

    <ul id="queuelist" class="list-group shadow-sm mb-4" style="max-height: 220px; overflow-y: auto; border-radius: 0.375rem;"></ul>
    

</div>

<div id="dlpush" style="height: 150px;"></div>

<style>
    .lds-ring div {
        box-sizing: border-box;
        display: block;
        position: absolute;
        width: 40px;
        height: 40px;
        margin: 4px;
        border: 4px solid #0d6efd;
        border-radius: 50%;
        animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        border-color: #0d6efd transparent transparent transparent;
    }
    .lds-ring div:nth-child(1) {
        animation-delay: -0.45s;
    }
    .lds-ring div:nth-child(2) {
        animation-delay: -0.3s;
    }
    .lds-ring div:nth-child(3) {
        animation-delay: -0.15s;
    }
    @keyframes lds-ring {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
    .progress, .progress-bar {
        height: 2rem !important;
        font-size: 1.2rem;
    }
</style>

<script>
    function isNumeric(n) {
        return !isNaN(parseFloat(n)) && isFinite(n);
    }
    function processdownload(){
        var yturl = $("#yturl").val().trim();
        if(yturl.length == 11){
            $.ajax({url: "/api/download/single/"+yturl, success: function(result){
            }});
        }
        else if(yturl.includes("watch?v=")){
            id = yturl.split('=')[1]
            $.ajax({url: "/api/download/single/"+id, success: function(result){
            }});
        }
        else {
            alert("Please enter a valid YouTube video URL or ID.");
        }
    }
    function processPatreonDownload(){
        var patreonurl = $("#patreonurl").val().trim();
        if(patreonurl.includes("patreon.com/posts/")){
            patreonurl = patreonurl.split('/')[4];
            patreonchannelid = $("#patreonchannelid").val().trim();
            if(!patreonchannelid){
                alert("Please enter a Destination Channel ID.");
                return;
            }
            $.ajax({url: "/api/download/patreon/"+patreonchannelid+"/"+patreonurl, success: function(result){
            }});
        } else {
            alert("Please enter a valid Patreon Post URL.");
        }
    }

    async function getStatus() {
        try {
            $("#queuelist").empty();
            const q = await fetch("/api/status/queue/");
            const qdata = await q.json();
            const queueSize = qdata['queue_size'];
            const queueValue = qdata['queue_value'];
            const activeDownloads = qdata['active'] || [];
            $("#queuelength").text(queueSize);

            // Show each active download as a card with progress bar
                $("#carddeck").empty();
            if (activeDownloads.length > 0) {
                activeDownloads.forEach((dl) => {
                    let pct = 0;
                    if (dl.progress) {
                        let cleaned = dl.progress.replace(/\x1b\[[0-9;]*m/g, "");
                        let match = dl.progress.match(/([0-9\.]+)%/);  // <-- updated regex
                        if (match) {
                            pct = parseFloat(match[1]);
                            pctText = match[1] + "%";
                        }
                    }
                    $("#carddeck").append(`
                        <div class="card shadow-sm mb-3">
                              <div class="card-body">
                                <h5 class="card-title">${dl.title || ''} (${dl.id})</h5>
                                <p class="mb-1"><span class="badge bg-info">${dl.type || ''}</span></p>
                                <div class="progress">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                                        role="progressbar"
                                        style="width: ${pct}%"
                                        aria-valuenow="${pct}"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >${pct+"%" || '0%'}</div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // Show the rest of the waiting queue as a simple list
            if(queueValue.length > 0){
                for(let i in queueValue){
                    let li = document.createElement('li');
                    li.appendChild(document.createTextNode(queueValue[i].url));
                    li.className = "list-group-item";
                    $("#queuelist").append(li);
                }
            }
        }
        catch(e){
            console.error("Polling Error",e);
        }
        setTimeout(getStatus,3000);
    }
    getStatus();
</script>
{% endblock %}
