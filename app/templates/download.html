{% extends "base.html" %}
{% block content %}

<div class="dl-page">

    <!-- YouTube Downloader -->

        <div class="dl-section-title">

            </svg>
            YouTube Downloader
        </div>
        <div class="dl-input-row">
            <div class="dl-input-wrap" id="yt-input-wrap">
                <svg class="dl-input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
                    <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
                </svg>
                <input id="yturl" type="text" class="dl-input" placeholder="Enter YouTube URL or video ID" aria-label="YouTube URL">
            </div>
            <button class="dl-btn" type="button" id="yt-download-btn" onclick="processdownload();">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Download
            </button>
        </div>
    </section>

    <div class="dl-divider"></div>

    <!-- Patreon Downloader -->
    <section class="dl-section">
        <div class="dl-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.678 11.894a1 1 0 0 1 .287.801 10.97 10.97 0 0 1-.398 2c1.395-.323 2.247-.697 2.634-.893a1 1 0 0 1 .71-.074A8.06 8.06 0 0 0 8 14c3.996 0 7-2.807 7-6 0-3.192-3.004-6-7-6S1 4.808 1 8c0 1.468.617 2.83 1.678 3.894zm-.493 3.905a21.682 21.682 0 0 1-.713.129c-.2.032-.352-.176-.273-.362a9.68 9.68 0 0 0 .244-.637l.003-.01c.248-.72.45-1.548.524-2.319C.743 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7-3.582 7-8 7a9.06 9.06 0 0 1-2.347-.306c-.52.263-1.639.742-3.468 1.105z"/>
            </svg>
            Patreon Downloader
        </div>
        <div class="dl-input-row dl-input-row--multi">
            <div class="dl-input-wrap" style="flex: 2;">
                <svg class="dl-input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
                    <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
                </svg>
                <input id="patreonurl" type="text" class="dl-input" placeholder="Patreon post URL" aria-label="Patreon URL">
            </div>
            <div class="dl-input-wrap" style="flex: 1;">
                <svg class="dl-input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                    <path fill-rule="evenodd" d="M5.216 14A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216z"/>
                    <path d="M4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
                </svg>
                <input id="patreonchannelid" type="text" class="dl-input" placeholder="Destination channel ID" aria-label="Destination Channel ID">
            </div>
            <button class="dl-btn" type="button" onclick="processPatreonDownload();">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Download
            </button>
        </div>
    </section>

    <div class="dl-divider"></div>

    <!-- Active downloads -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4" id="carddeck"></div>

    <!-- Queue -->
    <section class="dl-section">
        <div class="dl-queue-header">
            <div class="dl-section-title" style="margin-bottom:0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2.5 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11z"/>
                </svg>
                Download Queue
            </div>
            <span class="dl-queue-badge" id="queuelength">0</span>
        </div>
        <ul id="queuelist" class="dl-queue-list"></ul>
    </section>

</div>

<div id="dlpush" style="height: 80px;"></div>

<style>
    .dl-page {
        position: relative;
        z-index: 1;
        animation: fade-up 0.45s ease both;
    }
    .dl-section {
        margin-bottom: 0;
    }
    .dl-divider {
        border: none;
        border-top: 1px solid rgba(255,255,255,0.07);
        margin: 2rem 0;
    }
    .dl-section-title {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.15rem;
        font-weight: 700;
        color: #e8e8f0;
        margin-bottom: 1.1rem;
        letter-spacing: -0.01em;
    }
    .dl-section-title svg {
        opacity: 0.7;
        flex-shrink: 0;
    }
    /* Input row */
    .dl-input-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }
    .dl-input-row--multi .dl-input-wrap {
        min-width: 180px;
    }
    .dl-input-wrap {
        display: flex;
        align-items: center;
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 0 1rem;
        height: 48px;
        transition: border-color 0.2s ease, background 0.2s ease;
    }
    .dl-input-wrap:focus-within {
        background: rgba(255,255,255,0.1);
        border-color: #a78bfa;
        box-shadow: 0 0 0 3px rgba(167,139,250,0.18);
    }
    .dl-input-icon {
        color: rgba(255,255,255,0.35);
        flex-shrink: 0;
        margin-right: 0.6rem;
        transition: color 0.2s ease;
    }
    .dl-input-wrap:focus-within .dl-input-icon {
        color: #a78bfa;
    }
    .dl-input {
        background: transparent;
        border: none;
        outline: none;
        color: #e8e8f0;
        font-family: inherit;
        font-size: 0.95rem;
        width: 100%;
        padding: 0;
    }
    .dl-input::placeholder {
        color: rgba(255,255,255,0.3);
    }
    .dl-btn {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0 1.4rem;
        height: 48px;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity 0.2s ease, transform 0.15s ease;
        box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .dl-btn:hover {
        opacity: 0.88;
        transform: translateY(-2px);
    }
    .dl-btn:active {
        transform: translateY(0);
        opacity: 1;
    }
    /* Queue */
    .dl-queue-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.85rem;
    }
    .dl-queue-badge {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.2rem 0.75rem;
        min-width: 2rem;
        text-align: center;
    }
    .dl-queue-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }
    .dl-queue-list li {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-size: 0.85rem;
        color: #c0c0d0;
    }
    /* Active download cards */
    #carddeck .card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        color: #e8e8f0;
    }
    #carddeck .card-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #e8e8f0;
    }
    #carddeck .badge {
        background: rgba(167,139,250,0.2) !important;
        color: #a78bfa;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.3em 0.75em;
    }
    #carddeck .progress {
        height: 1.6rem !important;
        background: rgba(255,255,255,0.08);
        border-radius: 8px;
        overflow: hidden;
    }
    #carddeck .progress-bar {
        height: 100% !important;
        font-size: 0.82rem;
        font-weight: 600;
        background: linear-gradient(90deg, #7c3aed, #4f46e5) !important;
        border-radius: 8px;
    }
</style>

<script>
    function isNumeric(n) {
        return !isNaN(parseFloat(n)) && isFinite(n);
    }
    function processdownload(){
        var yturl = $("#yturl").val().trim();
        if(yturl.length == 11){
            $.ajax({url: "/api/download/single/"+yturl, success: function(result){
            }});
        }
        else if(yturl.includes("watch?v=")){
            id = yturl.split('=')[1]
            $.ajax({url: "/api/download/single/"+id, success: function(result){
            }});
        }
        else {
            alert("Please enter a valid YouTube video URL or ID.");
        }
    }
    function processPatreonDownload(){
        var patreonurl = $("#patreonurl").val().trim();
        if(patreonurl.includes("patreon.com/posts/")){
            patreonurl = patreonurl.split('/')[4];
            patreonchannelid = $("#patreonchannelid").val().trim();
            if(!patreonchannelid){
                alert("Please enter a Destination Channel ID.");
                return;
            }
            $.ajax({url: "/api/download/patreon/"+patreonchannelid+"/"+patreonurl, success: function(result){
            }});
        } else {
            alert("Please enter a valid Patreon Post URL.");
        }
    }

    async function getStatus() {
        try {
            $("#queuelist").empty();
            const q = await fetch("/api/status/queue/");
            const qdata = await q.json();
            const queueSize = qdata['queue_size'];
            const queueValue = qdata['queue_value'];
            const activeDownloads = qdata['active'] || [];
            $("#queuelength").text(queueSize);

            // Show each active download as a card with progress bar
                $("#carddeck").empty();
            if (activeDownloads.length > 0) {
                activeDownloads.forEach((dl) => {
                    let pct = 0;
                    if (dl.progress) {
                        let cleaned = dl.progress.replace(/\x1b\[[0-9;]*m/g, "");
                        let match = dl.progress.match(/([0-9\.]+)%/);  // <-- updated regex
                        if (match) {
                            pct = parseFloat(match[1]);
                            pctText = match[1] + "%";
                        }
                    }
                    $("#carddeck").append(`
                        <div class="card shadow-sm mb-3">
                              <div class="card-body">
                                <h5 class="card-title">${dl.title || ''} (${dl.id})</h5>
                                <p class="mb-1"><span class="badge bg-info">${dl.type || ''}</span></p>
                                <div class="progress">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                                        role="progressbar"
                                        style="width: ${pct}%"
                                        aria-valuenow="${pct}"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >${pct+"%" || '0%'}</div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // Show the rest of the waiting queue as a simple list
            if(queueValue.length > 0){
                for(let i in queueValue){
                    let li = document.createElement('li');
                    li.appendChild(document.createTextNode(queueValue[i].url));
                    li.className = "list-group-item";
                    $("#queuelist").append(li);
                }
            }
        }
        catch(e){
            console.error("Polling Error",e);
        }
        setTimeout(getStatus,3000);
    }
    getStatus();
</script>
{% endblock %}
