{% extends "base.html" %}
{% block content %}

<div class="dl-page">

    <!-- YouTube Downloader -->
    <section class="dl-section">
        <div class="dl-section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.007 2.007 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.007 2.007 0 0 1-1.415-1.419c-.111-.417-.185-.986-.235-1.558L.09 9.82l-.008-.104A31.4 31.4 0 0 1 0 7.68v-.123c.002-.215.01-.958.064-1.778l.007-.103.003-.052.008-.104.022-.26.01-.104c.048-.519.119-1.023.22-1.402a2.007 2.007 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A99.788 99.788 0 0 1 7.858 2h.193zM6.4 5.209v4.818l4.157-2.408L6.4 5.209z"/>
            </svg>
            Video Downloader
        </div>
        <div class="dl-input-row">
            <div class="dl-input-wrap" id="yt-input-wrap">
                <svg class="dl-input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
                    <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
                </svg>
                <input id="yturl" type="text" class="dl-input" placeholder="Enter URL, video/playlist/channel ID, or shorts URL" aria-label="Video URL">
            </div>
            <button class="dl-btn" type="button" id="yt-download-btn" onclick="processdownload();">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Download
            </button>
        </div>
    </section>

    <div class="dl-divider"></div>

    <!-- Active downloads -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4" id="carddeck"></div>

    <!-- Queue -->
    <section class="dl-section">
        <div class="dl-queue-header">
            <div class="dl-section-title" style="margin-bottom:0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2.5 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11zm0 3a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1h-11z"/>
                </svg>
                Download Queue
            </div>
            <span class="dl-queue-badge" id="queuelength">0</span>
        </div>
        <ul id="queuelist" class="dl-queue-list"></ul>
    </section>

    <div class="dl-divider"></div>

    <!-- Download Errors -->
    <section class="dl-section">
        <div class="dl-queue-header">
            <div class="dl-section-title" style="margin-bottom:0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8.982 1.53a.5.5 0 0 0-.964.286l-1.33 6.6a.5.5 0 0 0 .496.604h7a.5.5 0 0 0 .496-.604l-1.33-6.6a.5.5 0 0 0-.964-.286L8.982 1.53zm-3.692 1.638a.5.5 0 0 0-.286.964l6.6 1.33a.5.5 0 0 0 .604-.496v-7a.5.5 0 0 0-.604-.496l-6.6 1.33a.5.5 0 0 0-.286.964l6.6 1.33a.5.5 0 0 0 .496.604v7a.5.5 0 0 0-.496.604l-6.6-1.33z"/>
                    <path d="M8 4.5a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 0-.5-.5h-1zm0 6a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                </svg>
                Download Errors
            </div>
            <button class="dl-clear-btn" type="button" onclick="clearErrors();">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5V6a.5.5 0 0 0-.5-.5h-1z"/>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                </svg>
                Clear Errors
            </button>
        </div>
        <ul id="errorslist" class="dl-queue-list dl-errors-list"></ul>
    </section>

</div>

<div id="dlpush" style="height: 80px;"></div>

<style>
    .dl-page {
        position: relative;
        z-index: 1;
        animation: fade-up 0.45s ease both;
    }
    .dl-section {
        margin-bottom: 0;
    }
    .dl-divider {
        border: none;
        border-top: 1px solid rgba(255,255,255,0.07);
        margin: 2rem 0;
    }
    .dl-section-title {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.15rem;
        font-weight: 700;
        color: #e8e8f0;
        margin-bottom: 1.1rem;
        letter-spacing: -0.01em;
    }
    .dl-section-title svg {
        opacity: 0.7;
        flex-shrink: 0;
    }
    .dl-clear-btn {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(220,38,38,0.2);
        border: 1px solid rgba(220,38,38,0.4);
        border-radius: 999px;
        color: #fca5a5;
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.75rem;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
    }
    .dl-clear-btn:hover {
        background: rgba(220,38,38,0.3);
        border-color: rgba(220,38,38,0.6);
        color: #f87171;
    }
    .dl-errors-list li {
        background: rgba(220,38,38,0.08);
        border: 1px solid rgba(220,38,38,0.15);
    }
    .dl-errors-list li .error-url {
        color: #fca5a5;
        font-weight: 600;
        word-break: break-all;
    }
    .dl-errors-list li .error-type {
        display: inline-block;
        background: rgba(220,38,38,0.2);
        color: #fca5a5;
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        margin-bottom: 0.25rem;
        font-weight: 600;
    }
    .dl-errors-list li .error-message {
        color: #e5e7eb;
        font-size: 0.8rem;
        word-break: break-all;
        line-height: 1.4;
    }
    .dl-errors-list li .error-time {
        color: #9ca3af;
        font-size: 0.7rem;
        margin-top: 0.35rem;
    }
    /* Input row */
    .dl-input-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }
    .dl-input-row--multi .dl-input-wrap {
        min-width: 180px;
    }
    .dl-input-wrap {
        display: flex;
        align-items: center;
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 0 1rem;
        height: 48px;
        transition: border-color 0.2s ease, background 0.2s ease;
    }
    .dl-input-wrap:focus-within {
        background: rgba(255,255,255,0.1);
        border-color: #a78bfa;
        box-shadow: 0 0 0 3px rgba(167,139,250,0.18);
    }
    .dl-input-icon {
        color: rgba(255,255,255,0.35);
        flex-shrink: 0;
        margin-right: 0.6rem;
        transition: color 0.2s ease;
    }
    .dl-input-wrap:focus-within .dl-input-icon {
        color: #a78bfa;
    }
    .dl-input {
        background: transparent;
        border: none;
        outline: none;
        color: #e8e8f0;
        font-family: inherit;
        font-size: 0.95rem;
        width: 100%;
        padding: 0;
    }
    .dl-input::placeholder {
        color: rgba(255,255,255,0.3);
    }
    .dl-btn {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0 1.4rem;
        height: 48px;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity 0.2s ease, transform 0.15s ease;
        box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .dl-btn:hover {
        opacity: 0.88;
        transform: translateY(-2px);
    }
    .dl-btn:active {
        transform: translateY(0);
        opacity: 1;
    }
    /* Queue */
    .dl-queue-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.85rem;
    }
    .dl-queue-badge {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.2rem 0.75rem;
        min-width: 2rem;
        text-align: center;
    }
    .dl-queue-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }
    .dl-queue-list li {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-size: 0.85rem;
        color: #c0c0d0;
    }
    /* Active download cards */
    #carddeck .card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        color: #e8e8f0;
    }
    #carddeck .card-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #e8e8f0;
    }
    #carddeck .badge {
        background: rgba(167,139,250,0.2) !important;
        color: #a78bfa;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.3em 0.75em;
    }
    #carddeck .progress {
        height: 1.6rem !important;
        background: rgba(255,255,255,0.08);
        border-radius: 8px;
        overflow: hidden;
    }
    #carddeck .progress-bar {
        height: 100% !important;
        font-size: 0.82rem;
        font-weight: 600;
        background: linear-gradient(90deg, #7c3aed, #4f46e5) !important;
        border-radius: 8px;
    }
</style>

<script>
    function isNumeric(n) {
        return !isNaN(parseFloat(n)) && isFinite(n);
    }
    function processdownload(){
        var url = $("#yturl").val().trim();
        if(!url){
            alert("Please enter a URL.");
            return;
        }
        fetch("/api/download/single", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({url: url})
        });
    }

    async function getStatus() {
        try {
            $("#queuelist").empty();
            const q = await fetch("/api/status/queue/");
            const qdata = await q.json();
            const queueSize = qdata['queue_size'];
            const queueValue = qdata['queue_value'];
            const activeDownloads = qdata['active'] || [];
            $("#queuelength").text(queueSize);

            // Show each active download as a card with progress bar
                $("#carddeck").empty();
            if (activeDownloads.length > 0) {
                activeDownloads.forEach((dl) => {
                    let pct = 0;
                    if (dl.progress) {
                        let cleaned = dl.progress.replace(/\x1b\[[0-9;]*m/g, "");
                        let match = dl.progress.match(/([0-9\.]+)%/);  // <-- updated regex
                        if (match) {
                            pct = parseFloat(match[1]);
                            pctText = match[1] + "%";
                        }
                    }
                    $("#carddeck").append(`
                        <div class="card shadow-sm mb-3">
                              <div class="card-body">
                                <h5 class="card-title">${dl.title || ''} (${dl.id})</h5>
                                <p class="mb-1"><span class="badge bg-info">${dl.type || ''}</span></p>
                                <div class="progress">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                                        role="progressbar"
                                        style="width: ${pct}%"
                                        aria-valuenow="${pct}"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >${pct+"%" || '0%'}</div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // Show the rest of the waiting queue as a simple list
            if(queueValue.length > 0){
                for(let i in queueValue){
                    let li = document.createElement('li');
                    li.appendChild(document.createTextNode(queueValue[i].url));
                    li.className = "list-group-item";
                    $("#queuelist").append(li);
                }
            }
        }
        catch(e){
            console.error("Polling Error",e);
        }
        setTimeout(getStatus,3000);
    }

    async function getErrors() {
        try {
            $("#errorslist").empty();
            const r = await fetch("/api/downloads/errors/");
            const errors = await r.json();
            
            if(errors.length > 0){
                for(let i in errors){
                    let li = document.createElement('li');
                    li.className = "list-group-item";
                    
                    let urlDiv = document.createElement('div');
                    urlDiv.className = "error-url";
                    urlDiv.textContent = errors[i].url;
                    li.appendChild(urlDiv);
                    
                    let typeSpan = document.createElement('span');
                    typeSpan.className = "error-type";
                    typeSpan.textContent = errors[i].error_type;
                    li.appendChild(typeSpan);
                    
                    let msgDiv = document.createElement('div');
                    msgDiv.className = "error-message";
                    msgDiv.textContent = errors[i].error_message;
                    li.appendChild(msgDiv);
                    
                    let timeDiv = document.createElement('div');
                    timeDiv.className = "error-time";
                    let errorDate = new Date(errors[i].created_at);
                    timeDiv.textContent = errorDate.toLocaleString();
                    li.appendChild(timeDiv);
                    
                    $("#errorslist").append(li);
                }
            }
        }
        catch(e){
            console.error("Error polling Error",e);
        }
        setTimeout(getErrors,5000);
    }

    async function clearErrors() {
        try {
            await fetch("/api/downloads/errors/", {
                method: "DELETE"
            });
            getErrors();
        }
        catch(e){
            console.error("Error clearing errors",e);
        }
    }

    getStatus();
    getErrors();
</script>
{% endblock %}
