{% extends "base.html" %}
{% block content %}

<div class="dl-page">

    <!-- YouTube Downloader -->

            </svg>
            Video Downloader
        </div>
        <div class="dl-input-row">
            <div class="dl-input-wrap" id="yt-input-wrap">

    <div class="dl-divider"></div>

        <div class="dl-section-title">

            </svg>
            Reddit Saved Posts
        </div>
        <div class="dl-input-row">
            <button class="dl-btn" type="button" id="reddit-saved-btn" onclick="enqueueRedditSaved();">

                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Enqueue Saved Posts
            </button>
            <span id="reddit-saved-status" class="dl-saved-status"></span>
        </div>
    </section>

    <div class="dl-divider"></div>

    <!-- Active downloads -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4" id="carddeck"></div>

    <!-- Queue -->

        <div class="dl-queue-header">

                Download Queue
            </div>
            <span class="dl-queue-badge" id="queuelength">0</span>
        </div>
        <ul id="queuelist" class="dl-queue-list"></ul>
    </section>

    <div class="dl-divider"></div>

    <!-- Download Errors -->
    <section class="dl-section">
        <div class="dl-queue-header">
            <div class="dl-section-title" style="margin-bottom:0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">

                    <path d="M8 4.5a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 0-.5-.5h-1zm0 6a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                </svg>
                Download Errors
            </div>
            <button class="dl-clear-btn" type="button" onclick="clearErrors();">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5V6a.5.5 0 0 0-.5-.5h-1z"/>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                </svg>
                Clear Errors
            </button>
        </div>
        <ul id="errorslist" class="dl-queue-list dl-errors-list"></ul>
    </section>

</div>

<div id="dlpush" style="height: 80px;"></div>

<script>
    // -----------------------------------------------------------------------
    // Submit a download
    // -----------------------------------------------------------------------
    function processdownload(){
        var url = $("#yturl").val().trim();
        if(!url){
            alert("Please enter a URL.");
            return;
        }
        fetch("/api/download/single", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({url: url})
        });
    }

    // -----------------------------------------------------------------------
    // Helpers shared by initial load and SSE updates
    // -----------------------------------------------------------------------
    function parsePct(progressStr) {
        if (!progressStr) return 0;
        // Strip ANSI escape codes before matching
        var cleaned = progressStr.replace(/\x1b\[[0-9;]*m/g, "");
        var match = cleaned.match(/([0-9.]+)%/);
        return match ? parseFloat(match[1]) : 0;
    }

    function cardHTML(dl) {
        var pct = parsePct(dl.progress);
        return `
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="card-title">${dl.title || ''} (${dl.id})</h5>
                    <p class="mb-1"><span class="badge bg-info">${dl.provider || ''}</span></p>
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                            role="progressbar"
                            style="width: ${pct}%"
                            aria-valuenow="${pct}"
                            aria-valuemin="0"
                            aria-valuemax="100"
                        >${pct}%</div>
                    </div>
                </div>
            </div>`;
    }

    function updateCard(dl) {
        var pct = parsePct(dl.progress);
        var cardEl = document.getElementById('card-' + dl.id);
        if (cardEl) {
            var bar = cardEl.querySelector('.progress-bar');
            bar.style.width = pct + '%';
            bar.setAttribute('aria-valuenow', pct);
            bar.textContent = pct + '%';
        } else {
            // New download started after page load – create the card
            var col = document.createElement('div');
            col.className = 'col';
            col.id = 'card-' + dl.id;
            col.innerHTML = cardHTML(dl);
            document.getElementById('carddeck').appendChild(col);
        }
    }

    function removeCard(id) {
        var el = document.getElementById('card-' + id);
        if (el) el.remove();
    }

    // -----------------------------------------------------------------------
    // Initial active-downloads load (also called on SSE reconnect to resync)
    // -----------------------------------------------------------------------
    async function loadActiveDownloads() {
        try {
            const r = await fetch("/api/status/queue/");
            const data = await r.json();
            const activeDownloads = data['active'] || [];

            $("#carddeck").empty();
            activeDownloads.forEach(function(dl) {
                var col = document.createElement('div');
                col.className = 'col';
                col.id = 'card-' + dl.id;
                col.innerHTML = cardHTML(dl);
                document.getElementById('carddeck').appendChild(col);
            });
        } catch(e) {
            console.error("loadActiveDownloads error", e);
        }
    }

    // -----------------------------------------------------------------------
    // Queue polling (size + waiting list) – runs independently at 5 s
    // -----------------------------------------------------------------------
    async function pollQueue() {
        try {
            const r = await fetch("/api/status/queue/");
            const data = await r.json();
            $("#queuelength").text(data['queue_size'] || 0);

            $("#queuelist").empty();
            (data['queue_value'] || []).forEach(function(item) {
                var li = document.createElement('li');
                li.textContent = item.url;
                $("#queuelist").append(li);
            });
        } catch(e) {
            console.error("pollQueue error", e);
        }
        setTimeout(pollQueue, 5000);
    }

    // -----------------------------------------------------------------------
    // Error polling – unchanged behaviour, runs at 5 s
    // -----------------------------------------------------------------------
    async function getErrors() {
        try {
            $("#errorslist").empty();
            const r = await fetch("/api/downloads/errors/");
            const errors = await r.json();

            if(errors.length > 0){
                errors.forEach(function(err) {
                    var li = document.createElement('li');
                    li.className = "list-group-item";

                    var urlDiv = document.createElement('div');
                    urlDiv.className = "error-url";
                    urlDiv.textContent = err.url;
                    li.appendChild(urlDiv);

                    var typeSpan = document.createElement('span');
                    typeSpan.className = "error-type";
                    typeSpan.textContent = err.error_type;
                    li.appendChild(typeSpan);

                    var msgDiv = document.createElement('div');
                    msgDiv.className = "error-message";
                    msgDiv.textContent = err.error_message;
                    li.appendChild(msgDiv);

                    var timeDiv = document.createElement('div');
                    timeDiv.className = "error-time";
                    timeDiv.textContent = new Date(err.created_at).toLocaleString();
                    li.appendChild(timeDiv);

                    $("#errorslist").append(li);
                });
            }
        } catch(e) {
            console.error("getErrors error", e);
        }
        setTimeout(getErrors, 5000);
    }

    async function clearErrors() {
        try {
            await fetch("/api/downloads/errors/", { method: "DELETE" });
            getErrors();
        } catch(e) {
            console.error("clearErrors error", e);
        }
    }

    // -----------------------------------------------------------------------
    // SSE connection for real-time progress
    // -----------------------------------------------------------------------
    var _sseFirstOpen = true;

    function connectSSE() {
        var evtSource = new EventSource('/api/status/stream');

        evtSource.onopen = function() {
            // On reconnect (not the very first open) resync active downloads
            // because we may have missed events while disconnected.
            if (!_sseFirstOpen) {
                loadActiveDownloads();
            }
            _sseFirstOpen = false;
        };

        evtSource.onmessage = function(e) {
            var data = JSON.parse(e.data);
            if (data.type === 'progress') {
                updateCard(data);
            } else if (data.type === 'complete') {
                removeCard(data.id);
            }
        };

        evtSource.onerror = function() {
            // EventSource will automatically attempt to reconnect; the onopen
            // handler above will resync state when it does.
        };
    }

    // -----------------------------------------------------------------------
    // Reddit saved posts
    // -----------------------------------------------------------------------
    async function enqueueRedditSaved() {
        const btn = document.getElementById('reddit-saved-btn');
        const status = document.getElementById('reddit-saved-status');
        btn.disabled = true;
        status.textContent = 'Fetching saved posts…';
        try {
            const r = await fetch('/api/reddit/saved', { method: 'POST' });
            const data = await r.json();
            if (data.success) {
                const n = data.data.enqueued;
                const sk = data.data.skipped;
                if (n === 0 && sk === 0) {
                    status.textContent = 'No saved posts found.';
                } else if (n === 0) {
                    status.textContent = `No media found in saved posts (${sk} text/link post${sk === 1 ? '' : 's'} skipped).`;
                } else {
                    status.textContent = `Enqueued ${n} post${n === 1 ? '' : 's'}${sk > 0 ? ` (${sk} non-media skipped)` : ''}.`;
                }
            } else {
                status.textContent = 'Error: ' + data.error;
            }
        } catch(e) {
            status.textContent = 'Request failed: ' + e;
        } finally {
            btn.disabled = false;
        }
    }

    // -----------------------------------------------------------------------
    // Bootstrap on page load
    // -----------------------------------------------------------------------
    loadActiveDownloads();
    pollQueue();
    getErrors();
    connectSSE();
