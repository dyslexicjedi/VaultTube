{% extends "base.html" %}
{% block content %}

<div class="vt-page-head">
    <h1>Search</h1>
    <span class="vt-sub" id="search-label"></span>
</div>

<div class="vt-grid" id="search-grid"></div>
<div class="vt-empty" id="search-empty" hidden>No results. Try different keywords.</div>
<ul class="vt-pages" id="search-pages"></ul>

<script src="/static/js/cards.js"></script>
<script>
(function () {
    var searchtxt = new URLSearchParams(window.location.search).get('txt') || '';
    document.getElementById('search-label').textContent = searchtxt ? '“' + searchtxt + '”' : '';
    var box = document.getElementById('searchtext');
    if (box) box.value = searchtxt;

    function load(p) {
        fetch('/api/search/' + encodeURIComponent(searchtxt) + '/' + ((p - 1) * 40))
            .then(function (r) { return r.json(); })
            .then(function (vids) {
                VT.render(document.getElementById('search-grid'), vids, { dot: true });
                document.getElementById('search-empty').hidden = vids.length > 0;
                VT.pager(document.getElementById('search-pages'), { page: p, hasNext: vids.length === 40, onPage: load });
                window.scrollTo({ top: 0 });
            });
    }

    if (searchtxt) load(1);
    else document.getElementById('search-empty').hidden = false;
})();
</script>
{% endblock %}
