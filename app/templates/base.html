<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!-- CSS -->
        <link href="/static/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="/static/css/stylesheet.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <title>VaultTube</title>
    </head>
    <body>
        <!-- Javascript -->
        <script src="/static/js/jquery.min.js"></script>
        <div class="container-lg py-4">
            <nav class="navbar navbar-expand-lg navbar-dark rounded shadow-sm mb-4" id="main-navbar">
                <div class="container-fluid">
                  <a class="navbar-brand fw-bold fs-4" href="/">VaultTube</a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 fs-6">
                      <li class="nav-item">
                        <a class="nav-link px-3" href="/download.html">Download</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link px-3" href="/channels.html">Channels</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link px-3" href="/playlists.html">Playlists</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link px-3" href="/stats.html">Stats</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link px-3" href="/random.html">Random</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link px-3" href="/upload.html">Upload</a>
                      </li>
                    </ul>

                    <form class="d-flex ms-3 navbar-search" onsubmit="do_search(); return false;">
                      <div class="navbar-search-wrap">
                        <svg class="navbar-search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
                        </svg>
                        <input class="navbar-search-input" type="search" placeholder="Search…" aria-label="Search" id="searchtext">
                        <button class="navbar-search-btn" type="button" onclick="do_search();">Search</button>
                      </div>
                    </form>
                  </div>
                </div>
            </nav>
        {% block content %}
        {% endblock %}
        </div>
        <hr class="my-4">
        <footer id="footer" class="py-3 shadow-sm mt-auto">
            <div class="container text-center">
                <p class="mb-0 fst-italic text-secondary">VaultTube v1.0.0-alpha &nbsp;
                  |&nbsp; <a href="https://github.com/jedihomelab/VaultTube" target="_blank" class="link-secondary"><img src="/static/imgs/github.svg" height="20" width="20" alt="GitHub" /></a>
                  &nbsp;|&nbsp; <a href="https://hub.docker.com/repository/docker/dyslexicjedi/vaulttube/general" target="_blank" class="link-secondary"><img src="/static/imgs/package.svg" height="20" width="20" alt="Docker" /></a>
                </p>
            </div>
        </footer>
        <script>
          function do_search(){
            var searchterm = $("#searchtext").val();
            window.location.href='/search.html?txt='+encodeURIComponent(searchterm);
          }
        </script>

    </body>
</html>
